[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile=false && pnpm --filter @coinbarn/shared build && pnpm --filter @coinbarn/api prisma:generate && pnpm --filter @coinbarn/api build"

[deploy]
startCommand = "pnpm --filter @coinbarn/api prisma:deploy && pnpm --filter @coinbarn/api start:prod"
healthcheckPath = "/api/v1/health"
restartPolicyType = "ON_FAILURE"
